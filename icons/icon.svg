<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b6af7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="136" y="152" width="240" height="272" rx="20" fill="none" stroke="white" stroke-width="28" stroke-linejoin="round"/>
  <!-- Clipboard top clip -->
  <rect x="196" y="128" width="120" height="48" rx="24" fill="none" stroke="white" stroke-width="28"/>
  <!-- Checkmark -->
  <polyline points="176,280 228,340 336,220" fill="none" stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
